<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product page</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Product Activities </legend>

            <label for="name">Name</label>
            <input type="text" name="name"> <br>

            <label for="model">Model</label>
            <input type="text" name="Model"> <br>

            <label for="exparied date">EX Date</label>
            <input type="date" name="exparied date"> <br>

            <label for="price">price</label>
            <input type="number" name="price"> <br>

            <label for="catagory">Catagory</label>
            <select name="catagory" id="catagory">
                <option value="Select cat" selected disabled>Select cat</option>
                <option value="cat-1">cat-1</option>
                <option value="cat-2">cat-2</option>
                <option value="cat-3">cat-3</option>
                <option value="cat-4">cat-4</option>
                <option value="cat-5">cat-5</option>
            </select> <br><br>
            <label for="description">Comments</label>
            <textarea name="Description" id="Description" rows="9" cols="18"></textarea> <br> <br>

            <input type="reset" value="Clear"> &nbsp; &nbsp;
            <input type="submit" value="submit">
        </fieldset>
    </form>
    
</body>
</html>
